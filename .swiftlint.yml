included:
  - App
  - Modules/Sources
  - Modules/Tests

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length: 2

force_unwrapping:
  severity: error
