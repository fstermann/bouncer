name: release-please

# Automated releases driven by Conventional Commits.
#
# On every push to main, release-please maintains a "release PR" that bumps the version in
# project.yml and updates CHANGELOG.md. Merging that PR creates the GitHub Release as a *draft*
# (see release-please-config.json); the build job attaches the signed artifacts and publishes it.
# A draft that fails to build is a draft nobody can download — a published one with no appcast.xml
# would 404 for every installed copy until someone noticed.
#
# A draft release has no git tag yet, so the build is handed the commit to check out and
# publishing is what creates the tag.
#
# The build is called in-run rather than triggered by the tag: a tag pushed with GITHUB_TOKEN
# does not start another workflow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.sha }}
    secrets: inherit
