name: release-please

# Automated releases driven by Conventional Commits.
#
# On every push to main, release-please maintains a "release PR" that bumps the version in
# project.yml and updates CHANGELOG.md. Merging that PR tags the release (vX.Y.Z) and creates
# the GitHub Release, which the build job below then attaches the signed artifacts to.
#
# The build is called in-run rather than triggered by the tag: a tag pushed with GITHUB_TOKEN
# does not start another workflow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
