name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the logic modules build and test without an Xcode project.
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Modules

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --strict

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project Bouncer.xcodeproj -scheme Bouncer \
            -configuration Release -derivedDataPath .build/xcode build
