# Source of truth for the Xcode project. `Bouncer.xcodeproj` is generated by
# `make generate` and is not checked in, so there is no pbxproj to merge-conflict.
name: Bouncer

options:
  bundleIdPrefix: com.bouncer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BouncerModules:
    path: Modules

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    GCC_NO_COMMON_BLOCKS: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      LLVM_LTO: YES_THIN

targets:
  Bouncer:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: BouncerModules
        product: BouncerFoundation
      - package: BouncerModules
        product: MenuBar
      - package: BouncerModules
        product: Settings
      - package: BouncerModules
        product: BouncerUI
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.bouncer.app
        PRODUCT_NAME: Bouncer
        # Ad-hoc signing keeps local builds runnable without a developer account.
        # Override CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM for a notarized build.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
