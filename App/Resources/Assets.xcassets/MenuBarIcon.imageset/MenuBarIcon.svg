  <g transform="translate(22 100)">
    <g fill="none" stroke="#000" stroke-width="22" stroke-linecap="round">
      <line x1="96" y1="44" x2="185" y2="44"/>
      <line x1="58" y1="88" x2="170" y2="88"/>
      <line x1="96" y1="132" x2="185" y2="132"/>
    </g>
    <circle cx="268" cy="88" r="64" fill="#000"/>
  </g>
</svg>
